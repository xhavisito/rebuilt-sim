<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>REBUILT Sim</title>
    <meta name="description" content="Simulador 3D no oficial de FRC 2026 REBUILT hecho por fans." />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="REBUILT Sim" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <style>
      /* Estilos mínimos de la pantalla de carga (el resto en src/ui/styles.css). */
      html, body { margin: 0; height: 100%; background: #0b0f17; color: #e8ecf3; overflow: hidden; }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: flex-start;
        justify-content: flex-end; gap: 16px; padding: 7vh 8vw; font: 600 14px/1.3 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #0b0c0f; z-index: 100; transition: opacity .4s;
      }
      #loading h1 { margin: 0; font: 400 clamp(56px, 12vw, 150px)/0.86 Impact, 'Arial Narrow Bold', sans-serif; letter-spacing: .01em; color: #ecebe6; }
      #loading h1 span { color: #f5c518; }
      #loading .bar { width: min(520px, 80vw); height: 4px; border-radius: 2px; background: #272a30; overflow: hidden; }
      #loading .bar > i { display: block; height: 100%; width: 0%; background: #f5c518; transition: width .25s; }
      #loading-text { color: #8b8e96; }
      #loading small { color: #5b5f68; font-weight: 500; }
    </style>
  </head>
  <body>
    <div id="loading" role="status" aria-live="polite">
      <h1>REBUILT<br /><span>SIM</span></h1>
      <div class="bar"><i id="loading-bar"></i></div>
      <div id="loading-text">Cargando…</div>
      <small>Simulador no oficial hecho por fans. No está afiliado a FIRST®.</small>
    </div>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
