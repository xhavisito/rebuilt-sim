<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>REBUILT Sim</title>
    <meta name="description" content="Simulador 3D no oficial de FRC 2026 REBUILT hecho por fans." />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="REBUILT Sim" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <style>
      /* Estilos mínimos de la pantalla de carga (el resto en src/ui/styles.css). */
      html, body { margin: 0; height: 100%; background: #0b0f17; color: #e8ecf3; overflow: hidden; }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 18px; font: 600 16px/1.3 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: radial-gradient(ellipse at center, #16233a 0%, #0b0f17 70%); z-index: 100;
        transition: opacity .4s;
      }
      #loading h1 { margin: 0; font-size: clamp(28px, 6vw, 56px); letter-spacing: .08em; }
      #loading h1 span { color: #f2c400; }
      #loading .bar { width: min(420px, 70vw); height: 8px; border-radius: 4px; background: #1d2638; overflow: hidden; }
      #loading .bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #e53935, #f2c400, #1e88e5); transition: width .2s; }
      #loading small { opacity: .6; font-weight: 400; }
    </style>
  </head>
  <body>
    <div id="loading" role="status" aria-live="polite">
      <h1>REBUILT <span>SIM</span></h1>
      <div class="bar"><i id="loading-bar"></i></div>
      <div id="loading-text">Cargando…</div>
      <small>Simulador no oficial hecho por fans. No está afiliado a FIRST®.</small>
    </div>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
